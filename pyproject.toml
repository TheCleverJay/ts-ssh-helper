[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-ssh-helper"
version = "0.1.0"
description = "Tailscale + Windows OpenSSH helper: generate ssh config, diagnose, print var checklist"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YuanAqi" }]
keywords = ["tailscale", "ssh", "openssh", "ops", "cli", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/YuanAqi/ts-ssh-helper"
Repository = "https://github.com/YuanAqi/ts-ssh-helper"
Issues = "https://github.com/YuanAqi/ts-ssh-helper/issues"
Changelog = "https://github.com/YuanAqi/ts-ssh-helper/blob/main/CHANGELOG.md"

[project.scripts]
ts-ssh = "ts_ssh_helper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
